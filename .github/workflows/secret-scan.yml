name: secret-scan

# A committed secret must fail the build even when it lands straight on main,
# so this runs on pushes as well as pull requests. The scan covers the whole
# history, so a secret merged earlier is still caught on every later push.
on:
  push:
    branches: [main]
  pull_request:

# Scanning only needs to read the repository.
permissions:
  contents: read

# Superseded runs are pointless: a newer commit is the one that matters.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone. With fetch-depth 1
          # gitleaks only sees the newest commit, so a secret committed earlier
          # would pass unnoticed and the scan would look green while broken.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          # Pinned to the version used locally, so CI and developer machines
          # agree on both the rules and the config schema.
          version=8.30.1
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh \
            | sh -s -- -b /usr/local/bin "$version"
          gitleaks version

      - name: Scan history for secrets
        run: |
          set -euo pipefail
          # --redact covers the report file as well as the log, so a detected
          # secret is not republished into the run log or the artifact below.
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            --verbose

      - name: Upload report
        # Only on failure, and already redacted: this is for triaging what was
        # found, not for circulating it.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
